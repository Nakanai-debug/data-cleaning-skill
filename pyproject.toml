[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cleaning-skill"
version = "0.1.0"
description = "Configurable data cleaning pipeline"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "python-dateutil>=2.8"]

[project.scripts]
data-clean = "data_cleaning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
